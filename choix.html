<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Document</title>
  <script defer src="script2.js"></script>
  
 
  <style>
    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      
      background-color: rgb(6, 121, 253);
    }

    #first{
        width: 100%;
        height: 80%;
        display: flex;
        justify-content: center;
        flex-direction: column;
        align-items: center;
    }

    #wow, p{
    font-family: 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
    font-size: clamp(2rem, 4vw, 2.4rem);
    font-weight: 900;
    text-shadow: -1px 0 black, 0 1px black, 1px 0 black, 0 -1px black, -4px 4px black, -3px 3px black, -2px 2px black, -1px 1px black;
    
    color: white;
   
    margin-bottom: 5%;
    }

    #troll{
        width: 250px;
        height: 250px;
    }

    #tt{
        width: 100%;
        height: 50%;
        display: flex;
        justify-content: center;
        align-items: flex-start;
    }

  </style>
   <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
 
</head>
<body>
    <div id="first"  >
        <h2 id="wow">Oh wow !</h2>
        <img id="troll" src="https://images.emojiterra.com/google/android-11/512px/1f643.png">
    </div>

     <div id="tt" data-aos="zoom-out-down"

    data-aos-anchor-placement="top">
        <p> test</p>
    </div>




  
  <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    

</body>
</html>
